# SonarCloud config. Fill organization + projectKey from sonarcloud.io
# ("Analyze new project" → this repo). SONAR_TOKEN is a GitHub Actions secret.
sonar.organization=alexisayenko
sonar.projectKey=alexisayenko_project-bloodtests-v2

sonar.sources=engine/src
sonar.tests=engine/test
sonar.test.inclusions=engine/test/**/*.ts

# Coverage (LCOV emitted by vitest --coverage, path relative to repo root)
sonar.javascript.lcov.reportPaths=engine/coverage/lcov.info

sonar.exclusions=engine/node_modules/**,engine/coverage/**
